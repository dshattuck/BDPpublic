name: Build BDP on GitHub Runner
run-name: Build BDP by @${{ github.actor }}

on: [workflow_dispatch, push]
env:
  DEV_VERSION: 26a_dev
  REF_NAME: ${{ github.ref_name }}  
  MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_TOKEN }}
  
jobs:
  build:
    permissions: write-all
    name: Build BDP on GitHub Runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            enable_cache: true
            suffix: linux.tar.gz
          - os: windows-latest
            enable_cache: true
            suffix: win64.zip
          - os: macos-26
            enable_cache: false
            suffix: maca64.tar.gz
          - os: macos-26-intel
            enable_cache: true
            suffix: maci64.tar.gz
            
    runs-on:
      labels: ["${{ matrix.os }}" ]

    steps:
      - name: Going out to clean
        if: runner.os == 'Linux'
        run: |
          echo "Before cleanup:"
          df -h
          # Delete massive pre-installed software directories
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          echo "After cleanup:"
          df -h
          
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set release version
        if: github.event_name == 'release'
        shell: bash
        run: |
          echo "VERSION=${REF_NAME#v}" >> $GITHUB_ENV

      - name: Set dev version
        if: github.event_name != 'release'
        shell: bash
        run: |
          echo "VERSION=${DEV_VERSION#v}" >> $GITHUB_ENV

      - name: Construct Package Name
        shell: bash
        run: |
          LOCAL_SHA=${GITHUB_SHA::7}     
          FILENAME=bdp_${{ env.VERSION }}_build_${LOCAL_SHA}_${{ matrix.suffix }}
          echo "SHORT_SHA=${LOCAL_SHA}" >> $GITHUB_ENV
          echo "PackageFile=${FILENAME}" >> $GITHUB_ENV          
          echo "Package=${{ github.workspace }}/packaging_tools/${FILENAME}" >> $GITHUB_ENV

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: ${{ matrix.enable_cache }}
          products: >
            MATLAB_Compiler
            Image_Processing_Toolbox
            Medical_Imaging_Toolbox
            Parallel_Computing_Toolbox

      - name: compile BDP Mex files
        uses: matlab-actions/run-command@v3
        with:
          startup-options: -sd packaging_tools
          command: CompileBDPMexFiles
          
      - name: compile BDP
        uses: matlab-actions/run-command@v3
        with:
          startup-options: -sd packaging_tools
          command: "CompileBrainSuiteDiffusionPipeline --package ${{ env.VERSION }} --build ${{ env.SHORT_SHA }} --lic GPL"

      - name: Install Apple Certificates
        if: runner.os == 'macOS'
        id: import_certs
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          
      - name: Execute Apple Code Signing & DMG Packaging
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "=== Staging MATLAB Output Package ==="
          cd ${{ github.workspace }}/packaging_tools
          mkdir -p bdp_dmg_stage
          if [ -f "${{ env.PackageFile }}" ]; then
            tar -xf "${{ env.PackageFile }}" -C bdp_dmg_stage/
            rm -f "${{ env.PackageFile }}" # Remove the unsigned archive
          else
            echo "Error: Target package file ${{ env.PackageFile }} not found!"
            exit 1
          fi          
          DMG_FILE="${PackageFile%.tar.gz}.dmg"
          find bdp_dmg_stage -type f \( -perm -u+x -o -name "*.mex*" \) \
            ! -name "*.icns" \
            ! -name "*.txt" \
            ! -name "*.xml" \
            ! -name "*.html" -exec \
            codesign --keychain "${{ steps.import_certs.outputs.keychain-path }}" \
                     --force --options runtime --deep \
                     --sign "${{ secrets.MACOS_TEAM_ID }}" {} \;
         
          hdiutil create -volname "BrainSuite Diffusion Pipeline" -srcfolder bdp_dmg_stage -ov -format UDZO "$DMG_FILE"

          echo "=== Submitting DMG to Apple Notarization Servers ==="
          # This command uploads the DMG, waits for verification, and staples the approval ticket automatically
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}" \
            --password "${{ secrets.MACOS_NOTARIZATION_PWD }}" \
            --team-id "${{ secrets.MACOS_TEAM_ID }}" \
            --wait
          sleep 30
          echo "=== Stapling the Notarization Ticket to the DMG ==="
          # Attaches the cryptographic proof directly to the file so it works completely offline
          xcrun stapler staple "$DMG_FILE"
          rm -rf bdp_dmg_stage
          echo "PackageFile=${DMG_FILE}" >> $GITHUB_ENV          
          echo "Package=${{ github.workspace }}/packaging_tools/${DMG_FILE}" >> $GITHUB_ENV


      - name: Save Build as Artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PackageFile }}
          path: ${{ env.Package }}
          archive: false
          overwrite: true
          retention-days: 7

      - name: Publish ${{ env.Package }}
        if: github.event_name == 'release'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.Package }}"
          tag: ${{ env.VERSION }}        
          allowUpdates: true

      - name: Go out to clean again
        if: always()
        shell: bash
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          rm -rf $GITHUB_WORKSPACE/.* 2>/dev/null || true

  # This job executes alone ONLY after all 4 matrix compilations finish successfully
  update_release_notes:
    name: Update Production Release Description
    needs: build                          # Forces this job to wait for your compilation job to finish
    if: github.event_name == 'release'     # Only run this for true official release events
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Publish Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Authenticates the native gh CLI engine
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 1. Clean out the 'v' if present to match your naming convention (e.g. 26a_RC1)
          CLEAN_VER="${TAG_NAME#v}"
          MACBADGE="[![MACOS](https://img.shields.io/static/v1?label=Download&message=macOS%20Signed&color=000000&style=for-the-badge&logo=apple&logoColor=white)]"
          LINBADGE="[![LINUX](https://img.shields.io/static/v1?label=Download&message=Linux%20x64&color=FCC624&style=for-the-badge&logo=linux&logoColor=black)]"
          WINBADGE="[![WINDOWS](https://img.shields.io/static/v1?label=Download&message=Windows%20x64&color=0078D4&style=for-the-badge&logo=windows&logoColor=white)]"

          echo "Compiling Markdown text block for Release ${TAG_NAME}..."
          
          # 2. Build your custom Markdown text template using a standard heredoc block
          # These download URLs exactly match GitHub's native asset distribution path structure
          read -r -d '' MARKDOWN_BODY <<EOF
          ## BrainSuite Diffusion Pipeline (BDP) {CLEAN_VER} - Release Notes
                  
          ### Releases                    
          * **Windows (x64):** ${WINBADGE}(https://github.com{{ github.repository }}/releases/download/${TAG_NAME}/bdp_${CLEAN_VER}_win64.zip)
          * **Linux (x64):** ${LINBADGE}(https://github.com{{ github.repository }}/releases/download/${TAG_NAME}/bdp_${CLEAN_VER}_linux.tar.gz)
          * **macOS Apple Silicon (ARM64 DMG):** ${MACBADGE}(https://github.com{{ github.repository }}/releases/download/${TAG_NAME}/bdp_${CLEAN_VER}_maca64.dmg)
          * **macOS Intel (x64 DMG):** ${MACBADGE}(https://github.com{{ github.repository }}/releases/download/${TAG_NAME}/bdp_${CLEAN_VER}_maci64.dmg)
          
          EOF
          
          # 3. Use the native GitHub CLI tool to instantly update the body text of the live tag
          echo "Updating release page on GitHub..."
          gh release edit "$TAG_NAME" --notes "$MARKDOWN_BODY"
          
